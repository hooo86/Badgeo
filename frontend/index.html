<!doctype html>
<html lang="fr"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<script>
  // Thème et langue appliqués avant l'affichage : pas de flash clair en mode sombre, bon sens d'écriture dès le départ
  try {
    var m = localStorage.getItem("badgeo.theme") || "auto";
    var dark = m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    var l = localStorage.getItem("badgeo.lang") || ((navigator.language || "fr").slice(0, 2));
    if (l === "ar" || l === "en" || l === "fr") { document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr"; }
  } catch (e) {}
</script>
<title>Badgeo</title></head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
