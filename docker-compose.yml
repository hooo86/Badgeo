x-backend: &backend
  build: ./backend
  env_file: .env
  depends_on: [db, redis]
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
  web:
    <<: *backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi -b 0.0.0.0:8000 -w 3"
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: celery -A config worker -l info
  beat:
    <<: *backend
    command: celery -A config beat -l info

volumes:
  pgdata:
