server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  root /usr/share/nginx/html;

  location /api/   { proxy_pass http://web:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /admin/ { proxy_pass http://web:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /static/ { proxy_pass http://web:8000; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
}
